[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/#declaring-project-metadata
authors = [
    { name = "Jurriaan H. Spaaks", email = "j.spaaks@esciencecenter.nl" },
]
maintainers = [
    { name = "Allen Lee", email = "allen.lee@asu.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Utilities"
]
dependencies = [
    "click >= 7.0, <9",
    "requests >=2.20, <3",
    "ruamel.yaml >=0.16.0",
    "pykwalify >=1.6",
    "jsonschema >=4.18.0, <5",
]
description = "Command line program to validate and convert CITATION.cff files."
keywords = [
    "citation",
    "credit",
    "CITATION.cff",
    "BibTeX",
    "EndNote",
    "RIS",
    "CodeMeta",
    "Zenodo"
]
license = "Apache-2.0"
name = "cffconvert"
readme = "README.md"
requires-python = ">=3.10"
version = "2026.8"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[project.urls]
Changelog = "https://github.com/SciCodes/cffconvert/blob/main/CHANGELOG.md"
Repository = "https://github.com/SciCodes/cffconvert"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[project.optional-dependencies]
dev = [
    "build == 1.5.0",
    "pre-commit == 4.6.2",
    "pyroma == 5.0.1",
    "ruff == 0.16.3",
    "setuptools >=83,<85"
]
gcloud = [
    "Flask == 3.1.3"
]
testing = [
    "pytest == 9.1.1",
    "pytest-cov == 7.1.0"
]

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[project.scripts]
cffconvert = "cffconvert.cli.cli:cli"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[tool.setuptools.packages.find]
where = ["src"]

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[tool.pytest.ini_options]
# Note that visual debugger in some editors like pycharm gets confused by coverage calculation.
# As a workaround, configure the test configuration in pycharm et al with a --no-cov argument
addopts = "--no-cov --verbose --maxfail=1 --strict-markers --import-mode=importlib --strict-config"
markers = [
    "apalike: Tests pertaining to 'apalike' export behavior",
    "bibtex: Tests pertaining to 'bibtex' export behavior",
    "cli: Tests pertaining to cffconvert's command line interface",
    "codemeta: Tests pertaining to 'codemeta' export behavior",
    "endnote: Tests pertaining to 'endnote' export behavior",
    "lib: Tests pertaining to cffconvert's library",
    "ris: Tests pertaining to 'ris' export behavior",
    "schemaorg: Tests pertaining to 'schema.org' export behavior",
    "zenodo: Tests pertaining to 'zenodo' export behavior",
]
minversion = "7.0"
pythonpath = [
    "src",
    "."
]
testpaths = [
    "tests"
]

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "C901", "Q", "S", "I001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cffconvert"]
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2
no-lines-before = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

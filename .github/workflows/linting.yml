name: linting

on: 
  pull_request:
  push:
    branches:
      - main

jobs:

  linting:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Show python info
        run: |
          which python3
          python3 --version

      - name: Install development dependencies
        run: uv pip install --system --editable .[dev,gcloud,testing]

      - name: Check sorting of imports
        # isort returns zero even when there are problems, explicitly check there is no output 
        run: |
          output=$(isort --check-only --diff src/cffconvert tests/)
          if [[ -n "$output" ]]; then
            exit 1
          else
            exit 0
          fi

      - name: Run prospector
        run: prospector --profile-path .prospector.yml

name: linting

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  linting:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Show python info
        run: |
          which python3
          python3 --version

      - name: Install development dependencies
        run: uv pip install --system --editable ".[dev,testing]"

      - name: Run ruff
        run: ruff check src/cffconvert tests

      - name: Run pyroma
        run: pyroma .

# prospector configuration file

---

output-format: grouped

strictness: veryhigh
doc-warnings: false
test-warnings: true
member-warnings: false

ignore-paths:
  - docs
  - src/cffconvert/gcloud/gcloud.py

pyroma:
    run: false

pycodestyle:
  full: true
  disable:
    - E501 # line length
    - E201 # whitespace after opening delimiter; handled by Ruff where supported
    - E202 # whitespace before closing delimiter; handled by Ruff where supported
    - E221 # multiple spaces before operator; retained in aligned output tables
    - E231 # missing whitespace after delimiter; handled by Ruff where supported

pylint:
    run: false

pydocstyle:
  disable:
    # Disable because not part of PEP257 official convention:
    # see http://pep257.readthedocs.io/en/latest/error_codes.html
    - D203  # 1 blank line required before class docstring
    - D212  # Multi-line docstring summary should start at the first line
    - D213  # Multi-line docstring summary should start at the second line
    - D404  # First word of the docstring should not be This
